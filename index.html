<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Area App</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="login" class="screen">
    <div class="login-card">
      <div class="logo">📍</div><h1>Local Area</h1><p id="loginSub">Connect with your local community</p>
      <input id="mobile" inputmode="numeric" maxlength="10" placeholder="Mobile Number">
      <button class="primary" onclick="sendOtp()">Send OTP</button>
      <div id="otpBox" class="hidden"><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter OTP (demo: 123456)"><button class="primary" onclick="verifyOtp()">Login</button></div>
      <small id="demoNote">Demo OTP: 123456</small>
    </div>
  </section>

  <section id="main" class="hidden">
    <header><div><b>📍 Local Area</b><small id="welcome"></small></div><button class="icon-btn" onclick="openMenu()">☰</button></header>
    <main>
      <div class="hero"><h2 id="hello">Welcome 👋</h2><p>Everything around your local area.</p></div>
      <div class="grid">
        <button onclick="showSection('shops')">🏪<span>Shops</span></button>
        <button onclick="showSection('news')">📰<span>News</span></button>
        <button onclick="showSection('jobs')">💼<span>Jobs</span></button>
        <button onclick="showSection('nearby')">📍<span>Nearby</span></button>
        <button onclick="showSection('offers')">🎁<span>Offers</span></button>
        <button onclick="showSection('services')">🔧<span>Services</span></button>
        <button onclick="showSection('events')">🎉<span>Events</span></button>
        <button onclick="showSection('emergency')">🚨<span>Emergency</span></button>
      </div>
      <div class="section-card"><div class="section-title"><h3>Recent Updates</h3><button onclick="showSection('news')">View all</button></div><div id="recentNews"></div></div>
    </main>
  </section>

  <aside id="menu" class="drawer">
    <div class="drawer-head"><b>Menu</b><button onclick="closeMenu()">✕</button></div>
    <div class="profile-mini">👤 <span id="menuName">User</span><small id="menuMobile"></small></div>
    <button onclick="profile()">👤 Profile</button>
    <button id="shopOwnerBtn" onclick="createShop()">🏪 Create / Edit Shop</button>
    <button onclick="createNews()">📰 Create News</button>
    <button onclick="createJob()">💼 Create Vacancy</button>
    <button onclick="showSection('saved')">❤️ Saved</button>
    <button onclick="reportBug()">🐞 Report Bug</button>
    <button onclick="toggleLang()">🌐 Tamil / English</button>
    <button onclick="openAdmin()">🛡️ Admin</button>
    <button class="danger" onclick="logout()">🚪 Logout</button>
  </aside>
  <div id="shade" class="shade" onclick="closeMenu()"></div>

  <section id="content" class="content hidden">
    <header><button class="icon-btn" onclick="goHome()">←</button><b id="pageTitle">Shops</b><button class="icon-btn" onclick="openMenu()">⋮</button></header>
    <main id="page"></main>
  </section>
</div>
<script src="js/app.js"></script>
</body></html>
